<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentKey Pro</title>
    <!-- 修正：带子目录引用 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <base target="_blank">
</head>
<body>
<div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
        <h2>🤖 AgentKey Pro</h2>
        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" value="testuser2">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="Test@1234">
        </div>
        <div class="input-group" id="emailGroup" style="display:none;">
            <label>邮箱</label>
            <input type="email" id="email" placeholder="test@example.com">
        </div>
        <button class="btn btn-primary" id="authBtn">登 录</button>
        <button class="btn btn-secondary" id="switchAuthBtn">还没有账号？去注册</button>
        <div class="error-msg" id="authError"></div>
        <div class="auth-hint">默认账号: testuser2 / Test@1234</div>
    </div>
</div>

<div class="app" id="app" style="display:none;">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><span>🤖</span> AgentKey</div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="session-area" id="sessionArea">
            <div class="session-search">
                <input type="text" id="sessionSearch" placeholder="搜索会话...">
            </div>
            <button class="new-session-btn" id="newSessionBtn">+ 新建会话</button>
            <div class="session-list" id="sessionList"></div>
        </div>
        <div class="sidebar-footer">
            <span id="navUserInfo">👤 未登录</span>
            <a href="#" id="logoutLink">退出</a>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <span class="page-title" id="pageTitle">对话</span>
            </div>
            <div class="topbar-right">
                <label class="rag-switch" title="启用知识库检索">
                    <input type="checkbox" id="ragToggle">
                    <span>📚 RAG</span>
                </label>
                <select class="model-select" id="modelSelect">
                    <option value="deepseek-chat">DeepSeek-V3</option>
                    <option value="deepseek-reasoner">DeepSeek-R1</option>
                </select>
                <button class="icon-btn" id="themeToggleBtn" title="切换主题">🌓</button>
            </div>
        </header>

        <div class="pages" id="pages">
            <!-- 聊天页 -->
            <div class="page active" id="page-chat">
                <div class="chat-layout">
                    <div class="messages" id="messageContainer"></div>
                    <div class="input-bar">
                        <div class="input-wrapper">
                            <div class="attachment-list" id="attachmentList"></div>
                            <textarea id="userInput" rows="1" placeholder="输入消息，或上传文件提问..."></textarea>
                        </div>
<!--                        -->
                        <input type="file" id="chatFileInput" style="display:none" accept="*/*">
                        <button class="btn-attach" id="attachBtn" title="上传文件">📎</button>
                        <button class="btn-send" id="sendBtn">发送</button>
                    </div>
                </div>
            </div>

            <!-- 知识库页 -->
            <div class="page" id="page-knowledge">
                <div class="page-container">
                    <div class="card">
                        <h3>📚 我的知识库</h3>
                        <div id="docListContainer">
                            <div class="empty-state">
                                <div class="empty-state-icon">📚</div>
                                <div>暂无文档</div>
                                <div style="font-size:13px;margin-top:8px;">上传 PDF、Word、Excel、TXT 等文件构建知识库</div>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>➕ 上传文档</h3>
                        <div class="form-row">
                            <label>选择文件（支持 PDF、Word、Excel、TXT、Markdown 等）</label>
                            <input type="file" id="docUploadInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.csv,.json,.java,.py,.js,.html,.xml,.sql,.yml,.yaml">
                        </div>
                        <div class="form-row">
                            <label>描述（可选）</label>
                            <input type="text" id="docDescription" placeholder="这份文档是关于什么的...">
                        </div>
                        <button class="btn-small btn-small-primary" id="docUploadBtn">上传并处理</button>
                        <span id="docUploadStatus" class="status-text"></span>
                        <div style="margin-top:12px;font-size:12px;color:var(--text-secondary);">
                            💡 上传后会自动解析、分块、生成 Embedding，处理时间取决于文件大小。
                        </div>
                    </div>
                </div>
            </div>



            <!-- Keys 页 -->
            <div class="page" id="page-keys">
                <div class="page-container">
                    <div class="card">
                        <h3>🔑 API Key 管理</h3>
                        <div id="keysListContainer">
                            <div class="empty-state">
                                <div class="empty-state-icon">🔐</div>
                                <div>暂无 API Key</div>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>➕ 添加新 Key</h3>
                        <div class="form-row">
                            <label>提供商</label>
                            <select id="newKeyProvider">
                                <option value="DEEPSEEK">DeepSeek</option>
                                <option value="OPENAI">OpenAI</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>API Key</label>
                            <input type="password" id="newKeyInput" placeholder="sk-...">
                        </div>
                        <div class="form-row">
                            <label>别名（可选）</label>
                            <input type="text" id="newKeyAlias" placeholder="默认Key">
                        </div>
                        <button class="btn-small btn-small-primary" id="saveKeyBtn">保存 Key</button>
                        <span id="keyStatus" class="status-text"></span>
                    </div>
                </div>
            </div>

            <!-- 个人中心 -->
            <div class="page" id="page-profile">
                <div class="page-container" style="max-width:600px;">
                    <div class="card">
                        <h3>👤 个人信息</h3>
                        <div class="form-row">
                            <label>用户名</label>
                            <input type="text" id="profileUsername" readonly>
                        </div>
                        <div class="form-row">
                            <label>邮箱</label>
                            <input type="email" id="profileEmail">
                        </div>
                        <button class="btn-small btn-small-primary" id="updateProfileBtn">保存修改</button>
                    </div>
                    <div class="card">
                        <h3>🔒 修改密码</h3>
                        <div class="form-row">
                            <label>原密码</label>
                            <input type="password" id="oldPassword">
                        </div>
                        <div class="form-row">
                            <label>新密码</label>
                            <input type="password" id="newPassword" placeholder="至少8位，含大小写+数字+特殊字符">
                        </div>
                        <div class="form-row">
                            <label>确认新密码</label>
                            <input type="password" id="confirmPassword">
                        </div>
                        <button class="btn-small btn-small-primary" id="changePwdBtn">更新密码</button>
                        <span id="pwdStatus" class="status-text"></span>
                    </div>
                </div>
            </div>

            <!-- 设置页 -->
            <div class="page" id="page-settings">
                <div class="page-container" style="max-width:600px;">
                    <div class="card">
                        <h3>🎨 界面设置</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <h4>深色模式</h4>
                                <p>切换浅色 / 深色主题</p>
                            </div>
                            <label class="toggle">
                                <input type="checkbox" id="darkModeToggle">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="card">
                        <h3>⚠️ 危险区域</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <h4>清空所有会话</h4>
                                <p>此操作不可恢复，将删除所有聊天记录</p>
                            </div>
                            <button class="btn-small btn-small-danger" id="clearAllBtn">清空</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 修正：带子目录引用 -->
<script type="module" src="js/app.js"></script>
</body>
</html>
