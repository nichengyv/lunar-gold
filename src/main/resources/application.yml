spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 【统一 PostgreSQL】业务表 + 向量表（pgvector）同库；容器端口 5433（避开本机原有 PG 的 5432）
    url: ${DB_URL:jdbc:postgresql://localhost:5433/agentkey_vector}
    username: ${DB_USERNAME:postgres}
    # 【本地开发】密码为创建 pgvector 容器时 POSTGRES_PASSWORD 设置的值，dev 配置里填写
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 实体 @Table(name="user") 中的 user 是 PG/ANSI 保留字，
        # 开启后 Hibernate 生成 SQL 时自动加引号，与迁移脚本中的 "user" 保持一致
        auto_quote_keyword: true
  flyway:
    # V1/V2 已改写为 PostgreSQL 方言；dev 保持 ddl-auto=update（flyway 关闭），
    # prod 为 flyway+validate（见 application-prod.yml）
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 【Boot 3 配置键】Redis 配置必须挂在 spring.data.redis 下；
  # 旧写法 spring.redis 在 Boot 3 会被完全忽略，导致连接参数不生效
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms
  # 【第四十三批】Spring AI 依赖已引入，但暂不启用自动配置：
  # 当前对话仍走自研 okhttp 客户端；不关掉的话缺少 api-key 会导致启动失败。
  # 第四十四批做双轨桥接时，再把 chat 打开并配置 base-url。
  ai:
    model:
      chat: none
      embedding: none
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:not-configured}
      chat:
        enabled: false
      embedding:
        enabled: false
    # 【第五十一批】MCP 客户端：默认关闭，不影响现有启动与对话。
    # 打开后按下面的 stdio 连接拉起外部 server，由 McpToolBridge 把工具注册进 ToolRegistry，
    # 且只在「可执行」权限下对模型可见。
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        type: sync
        name: ${MCP_CLIENT_NAME:agent-gateway-mcp}
        version: 1.0.0
        # 关闭自动初始化：改由 McpToolBridge 逐个 try/catch 初始化，
        # 单个 server 拉不起来（npx 拉包失败/进程崩溃）只跳过它自己，不拖垮应用启动
        initialized: false
        request-timeout: ${MCP_REQUEST_TIMEOUT:60s}
        stdio:
          connections:
            filesystem:
              # Windows 不能直接启动 npx.cmd，必须经 cmd /c；
              # Linux/macOS 部署时把 MCP_STDIO_COMMAND 设为 npx，并同步删掉 args 里的 /c
              command: ${MCP_STDIO_COMMAND:cmd}
              args:
                - /c
                - npx
                - "-y"
                # 固定官方包版本，避免 npx 每次拉取不可审计的最新代码
                - "${MCP_FILESYSTEM_PACKAGE:@modelcontextprotocol/server-filesystem@2.2.0}"
                # 启动根目录：filesystem server 启动时必须声明至少一个目录（否则直接退出）。
                # 用系统临时目录作安全兜底——天然存在、无敏感业务文件；
                # 真正的可访问范围由会话开始时 McpToolBridge.bindWorkspacePath() 通过 MCP Roots 动态追加，
                # 这样每个项目的 workspacePath 自动进白名单，用户不用手动改任何配置
                - ${MCP_FS_TMPDIR:${java.io.tmpdir}}
  # 邮件（注册验证码 / 找回密码）。MAIL_HOST 为空时 MailConfig 会降级为日志模式，
  # 生产必须配置真实 SMTP，否则发送验证码会返回「邮件服务未配置」
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          # 465 端口走 SMTPS；改用 587 时把 MAIL_SMTP_SSL 设为 false、MAIL_SMTP_STARTTLS 设为 true
          ssl:
            enabled: ${MAIL_SMTP_SSL:true}
          starttls:
            enabled: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 50MB      # 单个文件最大 50MB
      max-request-size: 100MB  # 整个请求最大 100MB
      enabled: true

# 【第四十四批】Spring AI ChatModel（OpenAI 兼容协议接 DeepSeek）。
# 第四十九批删旧后已是唯一模型接入层；如需回退，回滚到删旧前的提交即可
agent:
  spring-ai:
    # DeepSeek 的 OpenAI 兼容入口；Spring AI 默认补 /v1/chat/completions
    base-url: ${AGENT_SPRING_AI_BASE_URL:https://api.deepseek.com}
    completions-path: ${AGENT_SPRING_AI_COMPLETIONS_PATH:/v1/chat/completions}
    # 【P4-06】模型调用韧性
    # 流式调用两个分片之间的最大空闲秒数；超时即判定本次调用失败（不限制总时长）
    idle-timeout-seconds: ${AGENT_MODEL_IDLE_TIMEOUT_SECONDS:60}
    # 非流式辅助调用（会话摘要、图片转写）的总时长上限
    sync-timeout-seconds: ${AGENT_MODEL_SYNC_TIMEOUT_SECONDS:60}
    # 同一模型的最大尝试次数（含首次）；已输出内容后不再重试
    max-attempts: ${AGENT_MODEL_MAX_ATTEMPTS:3}
    # 指数退避基数，第 n 次重试等待 base * 2^(n-1)，上限 8s
    retry-backoff-ms: ${AGENT_MODEL_RETRY_BACKOFF_MS:500}
    # 跨 Provider 备选模型必须显式配置（逗号分隔）。
    # 默认空：base-url 指向 DeepSeek 时填 qwen/moonshot 只会得到 400，属于无效请求
    fallback-models: ${AGENT_MODEL_FALLBACKS:}
    # Provider 级熔断：同一 base-url 连续失败达到阈值后快速失败
    circuit:
      failure-threshold: ${AGENT_MODEL_CIRCUIT_THRESHOLD:5}
      open-millis: ${AGENT_MODEL_CIRCUIT_OPEN_MILLIS:30000}
  # 【P5-10-3】单次运行预算；0 表示不限制，接近上限时前端提示，达到上限后停止并说明原因
  budget:
    max-tokens-per-run: ${AGENT_BUDGET_MAX_TOKENS_PER_RUN:0}
    max-seconds-per-run: ${AGENT_BUDGET_MAX_SECONDS_PER_RUN:0}
  # 【P5-13】连续重复调用/失败与无推进轮次的安全停止阈值，0 表示关闭对应检测
  loop:
    no-progress:
      max-repeats: ${AGENT_LOOP_NO_PROGRESS_MAX_REPEATS:3}
      max-stagnant-rounds: ${AGENT_LOOP_NO_PROGRESS_MAX_STAGNANT_ROUNDS:4}
  # 【P5-08】单轮内连续只读工具的并发上限；写/命令仍串行并逐条审批。
  # 上限由 Runtime 用例的实际批规模（2～3）与 fixture 基准的 p95 收益确定，不按经验随意放大。
  parallel:
    readonly-max-concurrency: ${AGENT_PARALLEL_READONLY_MAX_CONCURRENCY:3}
  # 【R5 / P7-07 + P7-09】上下文接缝：计划软注入与三层压缩。
  # 默认关闭：尚未完成 L2/L3 真实模型 A/B，先保持既有行为；开启后先用 `AGENT_CONTEXT_*` 灰度验证。
  context:
    plan-injection:
      # 每轮从 agent_run.plan_json 重读最新计划，作为 user 消息软注入（不做控制流）
      enabled: ${AGENT_CONTEXT_PLAN_INJECTION_ENABLED:false}
    condense:
      # 三层压缩总开关：语义折叠 → 摘要 → 滑窗；关闭时消息原样发送
      enabled: ${AGENT_CONTEXT_CONDENSE_ENABLED:false}
      # 滑窗硬上限（字符，约 30k tokens）；超出后从最早消息 FIFO 淘汰，保留首条 system
      window-chars: ${AGENT_CONTEXT_CONDENSE_WINDOW_CHARS:120000}
      # 摘要触发阈值占 window-chars 的比例；默认 70%
      summarize-ratio: ${AGENT_CONTEXT_CONDENSE_SUMMARIZE_RATIO:0.7}
      # 末尾保留的消息条数；工具调用组会向前扩展，避免切开 tool_calls 与 tool 响应
      keep-recent-messages: ${AGENT_CONTEXT_CONDENSE_KEEP_RECENT_MESSAGES:6}
  # 【P5-05】变更文件诊断：默认进程内 javac；provider=lsp 时走外部 language server，
  # 未配置 lsp.command 或启动失败会自动降级，不阻塞工具调用
  diagnostics:
    enabled: ${AGENT_DIAGNOSTICS_ENABLED:true}
    provider: ${AGENT_DIAGNOSTICS_PROVIDER:javac}   # javac / lsp / none
    max-items: ${AGENT_DIAGNOSTICS_MAX_ITEMS:20}
    max-chars: ${AGENT_DIAGNOSTICS_MAX_CHARS:8192}
    timeout-ms: ${AGENT_DIAGNOSTICS_TIMEOUT_MS:20000}
    max-files: ${AGENT_DIAGNOSTICS_MAX_FILES:5}
    lsp:
      command: ${AGENT_DIAGNOSTICS_LSP_COMMAND:}
      args: ${AGENT_DIAGNOSTICS_LSP_ARGS:}
      language-id: ${AGENT_DIAGNOSTICS_LSP_LANGUAGE_ID:java}
  # 【P5-06】项目验证回路：命令来自工作区 .lunargold/verify.json，
  # 这里只控制全局开关、配置路径、重试上限与输出/超时兜底
  verify:
    enabled: ${AGENT_VERIFY_ENABLED:true}
    config-path: ${AGENT_VERIFY_CONFIG_PATH:.lunargold/verify.json}
    max-retries: ${AGENT_VERIFY_MAX_RETRIES:2}
    max-output-chars: ${AGENT_VERIFY_MAX_OUTPUT_CHARS:4000}
    default-timeout-seconds: ${AGENT_VERIFY_DEFAULT_TIMEOUT_SECONDS:120}
  # 【P5-04】repo map：工作区目录 + 关键符号摘要，替代原来的单层目录树；
  # 字符预算耗尽时截断并提示模型改用 list_dir / search_files
  repo-map:
    enabled: ${AGENT_REPO_MAP_ENABLED:true}
    max-depth: ${AGENT_REPO_MAP_MAX_DEPTH:8}
    max-files: ${AGENT_REPO_MAP_MAX_FILES:500}
    max-chars: ${AGENT_REPO_MAP_MAX_CHARS:6000}
    max-symbols-per-file: ${AGENT_REPO_MAP_MAX_SYMBOLS_PER_FILE:6}
  # 【P5-01】提示词按场景选择版本：改这里即可切换/回滚，重启生效；
  # 运行中可 POST /api/admin/prompts/reload 校验并热加载（仅本机）
  prompt:
    scenario:
      agent:
        version: ${AGENT_PROMPT_AGENT_VERSION:v1}
      coding:
        version: ${AGENT_PROMPT_CODING_VERSION:v1}
      tool-mcp:
        version: ${AGENT_PROMPT_TOOL_MCP_VERSION:v1}
      tool-terminal:
        version: ${AGENT_PROMPT_TOOL_TERMINAL_VERSION:v1}
  # 【第五十一批】MCP 接入与工具注册策略
  mcp:
    client:
      # MCP SDK 的初始化超时默认 20 秒；stdio server 冷启动要先 npx 拉包，
      # 实测约 22 秒，故单独放大（通过 McpSyncClientCustomizer 设置）
      initialization-timeout: ${MCP_INITIALIZATION_TIMEOUT:120s}
    tools:
      # 空 = 放行全部已配置的 MCP server；填连接名（逗号分隔，如 filesystem）则只注册这些
      allowed-servers: ${MCP_ALLOWED_SERVERS:}
      # 单个工具返回文本上限，防止外部 server 的大输出把上下文撑爆
      max-result-chars: ${MCP_MAX_RESULT_CHARS:8000}
    # 【第五十二批】健康监控与熔断
    health:
      # 连续失败多少次后标记为 DOWN（熔断）
      failure-threshold: ${MCP_FAILURE_THRESHOLD:3}
      # DOWN 状态冷却期（毫秒）：超过这个时间后放行一次探测调用
      cooldown-ms: ${MCP_COOLDOWN_MS:300000}
      # 定时探测间隔（毫秒）：每多久 ping 所有已注册的 MCP server 一次
      probe-interval-ms: ${MCP_PROBE_INTERVAL_MS:30000}

deepseek:
  # 主对话模型（ReAct 循环、工具调用）
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  # 允许用户在对话框里切换的模型白名单，逗号分隔；不在列表内的请求一律回落到 model
  allowed-models: ${DEEPSEEK_ALLOWED_MODELS:deepseek-chat,deepseek-reasoner}
  # 视觉模型：用户上传截图时用来转写图片内容。DeepSeek 官方 deepseek-flash 支持图片输入
  vision-model: ${DEEPSEEK_VISION_MODEL:deepseek-flash}
  # 关掉后图片只按文件名元数据参与对话（不再调用视觉模型）
  vision-enabled: ${DEEPSEEK_VISION_ENABLED:true}

# Embedding 服务配置（RAG 向量化）
# 注意：DeepSeek 不提供 Embedding 端点，这里默认使用硅基流动 SiliconFlow（兼容 OpenAI 格式，国内可直连）
# embedding.api.key 为全局兜底密钥；优先使用用户在「API Keys」页配置的 provider=SILICONFLOW 的密钥
embedding:
  api:
    url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
    key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}

# 知识库检索门槛：min-score 为单片段相关度下限，gate-score 为"本轮是否使用资料"的最低分。
# bge-m3 对中文无关文本的相似度普遍在 0.3~0.45、相关文本多在 0.55 以上，故抬到 0.5/0.55，
# 避免问"现在几点"这类与资料无关的问题时也标注出处。语料差异大时按日志「RAG 命中片段相关度」微调。
# P5-07 混合检索：向量 + pg_trgm 词法召回，RRF 融合；词法分数独立设门槛，避免直接与余弦相似度比较。
rag:
  min-score: ${RAG_MIN_SCORE:0.5}
  gate-score: ${RAG_GATE_SCORE:0.55}
  hybrid-enabled: ${RAG_HYBRID_ENABLED:true}
  lexical-min-score: ${RAG_LEXICAL_MIN_SCORE:0.3}
  lexical-gate-score: ${RAG_LEXICAL_GATE_SCORE:0.35}
  rrf-k: ${RAG_RRF_K:60}

# 长上下文滚动摘要：历史超阈值时把较早的对话压成摘要持久化，后续注入 system prompt
context:
  summary:
    # 总开关：置 false 时退化为「只保留最近消息」的旧策略
    enabled: ${CONTEXT_SUMMARY_ENABLED:true}
    # 历史条数超过该值才考虑压缩
    trigger-messages: ${CONTEXT_SUMMARY_TRIGGER_MESSAGES:20}
    # 最近多少条保持原文，不压进摘要（与模型可见的最近窗口对齐）
    keep-recent-messages: ${CONTEXT_SUMMARY_KEEP_RECENT_MESSAGES:10}
    # 一次至少压缩多少条新消息才调用模型，避免每轮都压缩一两条
    min-new-messages: ${CONTEXT_SUMMARY_MIN_NEW_MESSAGES:6}
    # 送入摘要模型的原文上限（字符）
    max-input-chars: ${CONTEXT_SUMMARY_MAX_INPUT_CHARS:12000}
    # 摘要本身上限（字符），防止摘要越滚越长
    max-summary-chars: ${CONTEXT_SUMMARY_MAX_SUMMARY_CHARS:1200}
    # 摘要注入：由 SessionMemoryAdvisor 在 Spring AI 调用链追加到 system 消息（第四十九批删旧后唯一路径）

# 工作区文件系统配置
workspace:
  # Agent 单次读取文件的最大字节数，超出截断并提示。代码文件通常 < 100KB。
  max-read-bytes: ${WORKSPACE_MAX_READ_BYTES:102400}
  # Agent 可写文件的最大字节数，防止误写超大文件撑爆磁盘。
  max-write-bytes: ${WORKSPACE_MAX_WRITE_BYTES:524288}
  # 搜索结果最大返回条数，避免 grep 整库把上下文撑爆。
  max-search-results: ${WORKSPACE_MAX_SEARCH_RESULTS:50}
  # Agent 单次操作目录的最大深度（list_dir 递归时防止扫全盘）
  max-list-depth: ${WORKSPACE_MAX_LIST_DEPTH:3}
  # 终端命令执行（run_command）的沙箱参数
  command:
    # 总开关：部署到不受信任环境时置 false，Agent 只能读写文件、不能执行命令
    enabled: ${WORKSPACE_COMMAND_ENABLED:true}
    # 单条命令默认超时（秒），模型可通过 timeout 参数调大，但不超过 max-timeout-seconds
    timeout-seconds: ${WORKSPACE_COMMAND_TIMEOUT_SECONDS:120}
    max-timeout-seconds: ${WORKSPACE_COMMAND_MAX_TIMEOUT_SECONDS:600}
    # 返回给模型的输出上限（字符），超出只保留头部并标记截断
    max-output-bytes: ${WORKSPACE_COMMAND_MAX_OUTPUT_BYTES:8192}
    # 可执行程序白名单，逗号分隔；不配置则用代码里的默认开发工具列表
    allowed: ${WORKSPACE_COMMAND_ALLOWED:npm,npx,node,pnpm,yarn,git,mvn,mvnw,java,javac,gradle,gradlew,python,python3,pip,pip3,pytest,go,dotnet,cargo,make,cmake,tsc,vite}
    # 找不到 java/mvn 时的兜底：显式指定安装目录（IDEA 能编译不代表它们在系统 PATH 里）。
    # 下面两个是当前机器的默认值，换机器时改成自己的，或用环境变量覆盖；
    # 目录不存在会自动忽略并回退到 JAVA_HOME / MAVEN_HOME / PATH。
    java-home: "${WORKSPACE_JAVA_HOME:C:/Users/16680/.jdks/ms-21.0.11}"
    maven-home: "${WORKSPACE_MAVEN_HOME:D:/IDEA/IntelliJ IDEA 2024.1/plugins/maven/lib/maven3}"
    # 额外参与程序查找的目录，多个用分号分隔，如 "D:/tools/bin;D:/other/bin"
    extra-path: ${WORKSPACE_COMMAND_EXTRA_PATH:}
    # P4-01：OS 级沙箱（仅 Windows 生效）。命令进程挂进 Job Object，
    # 超时/取消/结束关闭句柄时由内核回收整棵进程树（含脱离父进程的后台 daemon）
    sandbox:
      enabled: ${WORKSPACE_COMMAND_SANDBOX_ENABLED:true}
      # 单进程提交内存上限（MB），0 = 不限
      memory-limit-mb: ${WORKSPACE_COMMAND_SANDBOX_MEMORY_MB:4096}
      # Job 内并发进程数上限，0 = 不限；npm/mvn 会派生子进程，别设太小
      max-processes: ${WORKSPACE_COMMAND_SANDBOX_MAX_PROCESSES:64}

app:
  version: ${APP_VERSION:1.0.0}
  mail:
    # 未配置 SMTP 时是否把验证码打到日志。仅开发环境可开，生产保持 false：
    # 否则会出现「接口成功、用户却收不到邮件」的静默故障
    log-codes: ${MAIL_LOG_CODES:false}
  download:
    # 发布桌面端后由发布环境注入；未配置时仅声明下载能力，不虚构版本号
    latest-version: ${DESKTOP_LATEST_VERSION:}
  jwt:
    # 密钥只从环境变量读取，仓库不保存任何可用默认值。
    # 缺失或强度不足时 SecretStartupValidator 会拒绝启动。生成：openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
  crypto:
    # AES 主密钥只从环境变量读取，Base64 编码的 16/24/32 字节。生成：openssl rand -base64 32
    master-key: ${AES_MASTER_KEY:}
  rsa:
    private-key: ${RSA_PRIVATE_KEY:}
    public-key: ${RSA_PUBLIC_KEY:}
  rate-limit:
    chat-requests-per-minute: ${RATE_LIMIT_CHAT:10}
  cors:
    # 前后端分离：Vite 开发服务器(5173)也需要直连后端；生产由 Nginx 同源反代，不产生跨域
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
  security:
    # CSP 的 connect-src（浏览器允许前端发起 fetch 的目标）。
    # 部署到正式域名后通过 CSP_CONNECT_SRC 覆盖，无需改代码：
    #   CSP_CONNECT_SRC='https://你的域名 https://api.deepseek.com https://api.tavily.com'
    csp-connect-src: ${CSP_CONNECT_SRC:http://localhost:8080 http://127.0.0.1:8080 http://localhost:5173 http://127.0.0.1:5173 https://api.deepseek.com https://api.tavily.com}

server:
  port: ${SERVER_PORT:8080}
  # HTTPS 由 Nginx / 云负载均衡终结，应用对外只提供 plain HTTP（容器内 8080）。
  # 下面几项仅在本地做 SSL 联调时临时启用，生产不要设置 SSL_ENABLED=true——
  # 应用自己管证书会让续期、重定向、HSTS 都变得更麻烦。
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:}

logging:
  level:
    com.capsule.agentkey: INFO
    org.springframework.security: INFO
    # MCP 客户端自动配置会无条件创建 sampling/elicitation 提供者，
    # 未实现对应能力时固定打两条 "No sampling methods found" WARN，属噪音，降为 ERROR
    org.springaicommunity.mcp.provider.sampling: ERROR
    org.springaicommunity.mcp.provider.elicitation: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # prometheus 暴露指标文本供采集端抓取；metrics 便于人工排查
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      # 打上应用标签，多服务共用 Prometheus 时可区分来源
      application: agent-gateway

# 接口文档（springdoc）：本地/测试环境开启，生产通过 SPRINGDOC_ENABLED=false 关闭
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

tavily:
  api:
    key: ${TAVILY_API_KEY:}