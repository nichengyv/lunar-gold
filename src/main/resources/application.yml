spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 【本地开发】useSSL=false，避免证书问题；生产环境改为 true
    url: ${DB_URL:jdbc:mysql://localhost:3306/agentkey?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 【本地开发】默认密码 123456；生产环境通过环境变量注入
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    timeout: 2000
  servlet:
    multipart:
      max-file-size: 50MB      # 单个文件最大 50MB
      max-request-size: 100MB  # 整个请求最大 100MB
      enabled: true

deepseek:
  api:
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}

app:
  jwt:
    # 【本地开发】默认 32 字节以上密钥；生产环境必须通过 JWT_SECRET 环境变量注入
    secret: ${JWT_SECRET:dev-secret-key-01234567890123456789012345678901}
    expiration: ${JWT_EXPIRATION:86400000}
  crypto:
    # 【本地开发】默认 AES 密钥；生产环境必须通过 AES_MASTER_KEY 环境变量注入
    master-key: ${AES_MASTER_KEY:LYk5GbTLyKXH86K9HEk2mYLPhgTZ2qdM6+RCEvpgYQ4=}
  rsa:
    private-key: ${RSA_PRIVATE_KEY:}
    public-key: ${RSA_PUBLIC_KEY:}
  rate-limit:
    chat-requests-per-minute: ${RATE_LIMIT_CHAT:10}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  security:
    force-https: ${FORCE_HTTPS:false}

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:}

logging:
  level:
    com.capsule.agentkey: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

tavily:
  api:
    key: ${TAVILY_API_KEY:}