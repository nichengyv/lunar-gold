spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 【统一 PostgreSQL】业务表 + 向量表（pgvector）同库；容器端口 5433（避开本机原有 PG 的 5432）
    url: ${DB_URL:jdbc:postgresql://localhost:5433/agentkey_vector}
    username: ${DB_USERNAME:postgres}
    # 【本地开发】密码为创建 pgvector 容器时 POSTGRES_PASSWORD 设置的值，dev 配置里填写
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 实体 @Table(name="user") 中的 user 是 PG/ANSI 保留字，
        # 开启后 Hibernate 生成 SQL 时自动加引号，与迁移脚本中的 "user" 保持一致
        auto_quote_keyword: true
  flyway:
    # V1/V2 已改写为 PostgreSQL 方言；dev 保持 ddl-auto=update（flyway 关闭），
    # prod 为 flyway+validate（见 application-prod.yml）
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 【Boot 3 配置键】Redis 配置必须挂在 spring.data.redis 下；
  # 旧写法 spring.redis 在 Boot 3 会被完全忽略，导致连接参数不生效
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 50MB      # 单个文件最大 50MB
      max-request-size: 100MB  # 整个请求最大 100MB
      enabled: true

deepseek:
  api:
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
  # 主对话模型（ReAct 循环、工具调用）
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  # 允许用户在对话框里切换的模型白名单，逗号分隔；不在列表内的请求一律回落到 model
  allowed-models: ${DEEPSEEK_ALLOWED_MODELS:deepseek-chat,deepseek-reasoner}
  # 视觉模型：用户上传截图时用来转写图片内容。DeepSeek 官方 deepseek-flash 支持图片输入
  vision-model: ${DEEPSEEK_VISION_MODEL:deepseek-flash}
  # 关掉后图片只按文件名元数据参与对话（不再调用视觉模型）
  vision-enabled: ${DEEPSEEK_VISION_ENABLED:true}

# Embedding 服务配置（RAG 向量化）
# 注意：DeepSeek 不提供 Embedding 端点，这里默认使用硅基流动 SiliconFlow（兼容 OpenAI 格式，国内可直连）
# embedding.api.key 为全局兜底密钥；优先使用用户在「API Keys」页配置的 provider=SILICONFLOW 的密钥
embedding:
  api:
    url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
    key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}

# 知识库检索门槛：min-score 为单片段相关度下限，gate-score 为"本轮是否使用资料"的最低分。
# bge-m3 对中文无关文本的相似度普遍在 0.3~0.45、相关文本多在 0.55 以上，故抬到 0.5/0.55，
# 避免问"现在几点"这类与资料无关的问题时也标注出处。语料差异大时按日志「RAG 命中片段相关度」微调。
rag:
  min-score: ${RAG_MIN_SCORE:0.5}
  gate-score: ${RAG_GATE_SCORE:0.55}

# 长上下文滚动摘要：历史超阈值时把较早的对话压成摘要持久化，后续注入 system prompt
context:
  summary:
    # 总开关：置 false 时退化为「只保留最近消息」的旧策略
    enabled: ${CONTEXT_SUMMARY_ENABLED:true}
    # 历史条数超过该值才考虑压缩
    trigger-messages: ${CONTEXT_SUMMARY_TRIGGER_MESSAGES:20}
    # 最近多少条保持原文，不压进摘要（与模型可见的最近窗口对齐）
    keep-recent-messages: ${CONTEXT_SUMMARY_KEEP_RECENT_MESSAGES:10}
    # 一次至少压缩多少条新消息才调用模型，避免每轮都压缩一两条
    min-new-messages: ${CONTEXT_SUMMARY_MIN_NEW_MESSAGES:6}
    # 送入摘要模型的原文上限（字符）
    max-input-chars: ${CONTEXT_SUMMARY_MAX_INPUT_CHARS:12000}
    # 摘要本身上限（字符），防止摘要越滚越长
    max-summary-chars: ${CONTEXT_SUMMARY_MAX_SUMMARY_CHARS:1200}

# 工作区文件系统配置
workspace:
  # Agent 单次读取文件的最大字节数，超出截断并提示。代码文件通常 < 100KB。
  max-read-bytes: ${WORKSPACE_MAX_READ_BYTES:102400}
  # Agent 可写文件的最大字节数，防止误写超大文件撑爆磁盘。
  max-write-bytes: ${WORKSPACE_MAX_WRITE_BYTES:524288}
  # 搜索结果最大返回条数，避免 grep 整库把上下文撑爆。
  max-search-results: ${WORKSPACE_MAX_SEARCH_RESULTS:50}
  # Agent 单次操作目录的最大深度（list_dir 递归时防止扫全盘）
  max-list-depth: ${WORKSPACE_MAX_LIST_DEPTH:3}
  # 终端命令执行（run_command）的沙箱参数
  command:
    # 总开关：部署到不受信任环境时置 false，Agent 只能读写文件、不能执行命令
    enabled: ${WORKSPACE_COMMAND_ENABLED:true}
    # 单条命令默认超时（秒），模型可通过 timeout 参数调大，但不超过 max-timeout-seconds
    timeout-seconds: ${WORKSPACE_COMMAND_TIMEOUT_SECONDS:60}
    max-timeout-seconds: ${WORKSPACE_COMMAND_MAX_TIMEOUT_SECONDS:300}
    # 返回给模型的输出上限（字符），超出只保留头部并标记截断
    max-output-bytes: ${WORKSPACE_COMMAND_MAX_OUTPUT_BYTES:8192}
    # 可执行程序白名单，逗号分隔；不配置则用代码里的默认开发工具列表
    allowed: ${WORKSPACE_COMMAND_ALLOWED:npm,npx,node,pnpm,yarn,git,mvn,mvnw,java,javac,gradle,gradlew,python,python3,pip,pip3,pytest,go,dotnet,cargo,make,cmake,tsc,vite}
    # 找不到 java/mvn 时的兜底：显式指定安装目录（IDEA 能编译不代表它们在系统 PATH 里）。
    # 下面两个是当前机器的默认值，换机器时改成自己的，或用环境变量覆盖；
    # 目录不存在会自动忽略并回退到 JAVA_HOME / MAVEN_HOME / PATH。
    java-home: "${WORKSPACE_JAVA_HOME:C:/Users/16680/.jdks/ms-21.0.11}"
    maven-home: "${WORKSPACE_MAVEN_HOME:D:/IDEA/IntelliJ IDEA 2024.1/plugins/maven/lib/maven3}"
    # 额外参与程序查找的目录，多个用分号分隔，如 "D:/tools/bin;D:/other/bin"
    extra-path: ${WORKSPACE_COMMAND_EXTRA_PATH:}

app:
  jwt:
    # 【本地开发】默认 32 字节以上密钥；生产环境必须通过 JWT_SECRET 环境变量注入
    secret: ${JWT_SECRET:dev-secret-key-01234567890123456789012345678901}
    expiration: ${JWT_EXPIRATION:86400000}
  crypto:
    # 【本地开发】默认 AES 密钥；生产环境必须通过 AES_MASTER_KEY 环境变量注入
    master-key: ${AES_MASTER_KEY:LYk5GbTLyKXH86K9HEk2mYLPhgTZ2qdM6+RCEvpgYQ4=}
  rsa:
    private-key: ${RSA_PRIVATE_KEY:}
    public-key: ${RSA_PUBLIC_KEY:}
  rate-limit:
    chat-requests-per-minute: ${RATE_LIMIT_CHAT:10}
  cors:
    # 前后端分离：Vite 开发服务器(5173)也需要直连后端；生产由 Nginx 同源反代，不产生跨域
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
  security:
    # CSP 的 connect-src（浏览器允许前端发起 fetch 的目标）。
    # 部署到正式域名后通过 CSP_CONNECT_SRC 覆盖，无需改代码：
    #   CSP_CONNECT_SRC='https://你的域名 https://api.deepseek.com https://api.tavily.com'
    csp-connect-src: ${CSP_CONNECT_SRC:http://localhost:8080 http://127.0.0.1:8080 http://localhost:5173 http://127.0.0.1:5173 https://api.deepseek.com https://api.tavily.com}

server:
  port: ${SERVER_PORT:8080}
  # HTTPS 由 Nginx / 云负载均衡终结，应用对外只提供 plain HTTP（容器内 8080）。
  # 下面几项仅在本地做 SSL 联调时临时启用，生产不要设置 SSL_ENABLED=true——
  # 应用自己管证书会让续期、重定向、HSTS 都变得更麻烦。
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:}

logging:
  level:
    com.capsule.agentkey: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # prometheus 暴露指标文本供采集端抓取；metrics 便于人工排查
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      # 打上应用标签，多服务共用 Prometheus 时可区分来源
      application: agent-gateway

# 接口文档（springdoc）：本地/测试环境开启，生产通过 SPRINGDOC_ENABLED=false 关闭
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

tavily:
  api:
    key: ${TAVILY_API_KEY:}