spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 8080

logging:
  level:
    root: WARN
    com.capsule.agentkey: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    master-key: ${AES_MASTER_KEY}
  rsa:
    private-key: ${RSA_PRIVATE_KEY}
    public-key: ${RSA_PUBLIC_KEY}
