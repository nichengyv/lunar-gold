spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 8080

# 生产环境关闭接口文档：避免暴露全部接口结构给公网探测
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.capsule.agentkey: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    master-key: ${AES_MASTER_KEY}
  rsa:
    private-key: ${RSA_PRIVATE_KEY}
    public-key: ${RSA_PUBLIC_KEY}
