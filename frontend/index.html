<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentKey Pro</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20x=%223%22%20y=%2213%22%20width=%2226%22%20height=%2215%22%20rx=%224%22%20fill=%22%231a73e8%22/%3E%3Ccircle%20cx=%2216%22%20cy=%227%22%20r=%223%22%20fill=%22%231a73e8%22/%3E%3Crect%20x=%2215%22%20y=%229%22%20width=%222%22%20height=%225%22%20fill=%22%231a73e8%22/%3E%3Ccircle%20cx=%2210%22%20cy=%2220%22%20r=%222%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2222%22%20cy=%2220%22%20r=%222%22%20fill=%22%23fff%22/%3E%3C/svg%3E">
    <script>
        // 应用挂载前恢复主题，避免刷新闪白
        (function () {
            var theme = localStorage.getItem('theme') || 'light';
            var root = document.documentElement;
            root.setAttribute('data-theme', theme);
            if (theme === 'dark') root.classList.add('dark');
        })();
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
