# AgentKey Pro 前端部署参考配置（Nginx）
# 用途：托管 frontend/dist 静态资源，并将 /api 反向代理到 Spring Boot。
# 将本文件复制到 /etc/nginx/conf.d/agentkey.conf 后 nginx -s reload。
# 使用前把 server_name 改为实际域名或 IP。

server {
    listen 80;
    server_name localhost;

    # 前端静态资源（npm run build 产物）
    root /var/www/agentkey/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退：/chat /keys 等路径刷新时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（同源部署，天然无 CORS 问题）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式聊天必需：关闭缓冲、延长读超时，避免长回答被掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
    }

    # 上传体积与后端 spring.servlet.multipart.max-file-size 保持一致
    client_max_body_size 50m;
}
